models:
  name: distilgpt2

dataset:
  name: "wikitext"
  config: "wikitext-2-raw-v1"
  format: "text"
  split: "train"
  text_column: "text"
  type: "wikitext"

training:
  epochs: 15
  batch_size: 16
  learning_rate: 0.000005
  dataset_size: 20000
  val_split_ratio: 0.1
  context_length: 64
  weight_decay: 0.01
  seed: 42

diagnostic:
  alpha: 0.2
  beta_train: 0.1
  betas_test: [0.0, 0.1, 0.3, 0.5, 0.8, 1.0]
  histogram_betas: [0, 0.5, 1]
  train_size: 5000
  test_size: 3000
  severity_name: "Hard ratio"
  severity_symbol: "β"
  
outputs:
  dir: "outputs/diagnostic/easy_hard_wikitext/distilgpt2"