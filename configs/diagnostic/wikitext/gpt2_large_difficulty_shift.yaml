models: # GPT2-large could not be fully fine-tuned on the available GPU due to memory limits with AdamW optimizer states.
  name: gpt2-large

dataset:
  name: "wikitext"
  config: "wikitext-2-raw-v1"
  format: "text"
  split: "train"
  text_column: "text"

training:
  epochs: 3
  batch_size: 1
  learning_rate: 0.000001
  dataset_size: 5000
  val_split_ratio: 0.1
  max_length: 16
  seed: 42

diagnostic:
  alpha: 0.2
  beta_train: 0.1
  betas_test: [0.0, 0.1, 0.3, 0.5, 0.8, 1.0]
  histogram_betas: [0, 0.5, 1]
  train_size: 3000
  test_size: 500
  severity_name: "Hard ratio"
  severity_symbol: "β"
  
outputs:
  dir: "outputs/diagnostic/easy_hard_wikitext/gpt2_large"