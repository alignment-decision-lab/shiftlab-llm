models:
  name: "distilgpt2"

dataset:
  name: "json"
  data_files: "hf://datasets/PKU-Alignment/ProgressGym-HistText/C017/*.json"
  format: "text"
  text_column: "content"
  split: "train"
  cleaning: "basic"
  type: "histtext"

training:
  epochs: 20
  batch_size: 16
  learning_rate: 0.00005
  dataset_size: 10000
  val_split_ratio: 0.1
  max_length: 64
  # weight_decay: 0.1
  seed: 42

diagnostic:
  alpha: 0.2
  beta_train: 0.1
  betas_test: [0.0, 0.1, 0.3, 0.5, 0.8, 1.0]
  histogram_betas: [0.0, 0.5, 1.0]
  train_size: 7000
  test_size: 2000
  severity_name: "Hard ratio"
  severity_symbol: "β"

outputs:
  dir: "outputs/diagnostic/easy_hard_histtext_c17/distilgpt2"