models:
  name: "distilgpt2"

dataset:
  type: "pg19"
  name: "emozilla/pg19"
  split: "train"
  text_column: "text"
  streaming: true
  cleaning: "basic"

training:
  epochs: 6
  batch_size: 16
  learning_rate: 0.00003
  weight_decay: 0.0
  dataset_size: 6000
  val_split_ratio: 0.1
  context_length: 64
  seed: 42

  gamma: 0.5

  rho: 0.1

  lambdas:
    small: 0.5 #0.2
    medium: 2.0 #1.0
    large: 5.0

diagnostic:
  train_pool_size: 4000
  test_pool_size: 2000
# for the construction of D_easy, D_medium and D_hard
  alpha_easy: 0.4 # pourcentage of easy examples taken from the dataset
  alpha_hard: 0.2 # pourcentage of hard examples taken from the dataset

# for the construction of the training set D_train = alpha_train * D_easy + beta_train * D_medium + (1 - alpha_train - beta_train) * D_hard
  alpha_train: 0.7 #0.4 # proportion of easy examples for the training set
  beta_train: 0.2 #0.4 # proportion of medium examples for the training set
  train_size: 2000

  scenario_names:
    - "mostly_easy"
    - "balanced"
    - "mostly_hard"

  alpha_k:
    - 0.85
    - 0.34
    - 0.05

  beta_k:
    - 0.10
    - 0.33
    - 0.15

  test_size: 500

outputs:
  dir: "outputs/kl_dro/pg19/distilgpt2_test"