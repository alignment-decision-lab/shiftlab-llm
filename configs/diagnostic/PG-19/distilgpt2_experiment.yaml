models:
  name: "distilgpt2"

dataset:
  type: "pg19"
  name: "emozilla/pg19"
  split: "train"
  text_column: "text"
  streaming: true
  cleaning: "basic"

training:
  epochs: 6
  batch_size: 16
  learning_rate: 0.00003
  weight_decay: 0.0
  dataset_size: 6000
  val_split_ratio: 0.1
  context_length: 64
  seed: 42

  gamma: 0.5
  lambda: 1.0
  rhos:
    small: 0.01
    medium: 0.1
    large: 1.0

diagnostic:
  alpha_easy: 0.4
  alpha_hard: 0.2

  alpha_train: 0.4
  beta_train: 0.4

  scenario_names:
    - "mostly_easy"
    - "balanced"
    - "mostly_hard"

  alpha_k:
    - 0.7
    - 0.34
    - 0.15

  beta_k:
    - 0.2
    - 0.33
    - 0.25
  train_size: 2000
  test_size: 800

outputs:
  dir: "outputs/kl_dro/pg19/distilgpt2_test"