models:
  name: gpt2

dataset:
  name: "OpenLLM-France/wikisource"
  config: null
  format: "text"
  text_column: "text"
  split: "train"
  cleaning: "wikisource"

training:
  epochs: 30
  batch_size: 8
  learning_rate: 0.00001
  dataset_size: 20000
  val_split_ratio: 0.1
  max_length: 64
  seed: 42

diagnostic:
  alpha: 0.2
  beta_train: 0.1
  betas_test: [0.0, 0.1, 0.3, 0.5, 0.8, 1.0]
  histogram_betas: [0, 0.5, 1]
  train_size: 7000
  test_size: 2000
  severity_name: "Hard ratio"
  severity_symbol: "β"
  
outputs:
  dir: "outputs/diagnostic/easy_hard_wikisource/gpt2_small"